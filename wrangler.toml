name = "email-tracker"
main = "worker.js"
compatibility_date = "2025-01-01"

# Fill in after: wrangler kv namespace create TRACK
kv_namespaces = [
  { binding = "TRACK", id = "PASTE_KV_NAMESPACE_ID_HERE" }
]

[vars]
NOTIFY_TO           = "you@example.com"   # where open/no-open alerts are sent
NOTIFY_FROM         = "Email Tracker <onboarding@resend.dev>"
UNOPENED_HOURS      = "24"   # alert if still not opened after this many hours
BURST_WINDOW_MIN    = "30"   # "opened many times" window
BURST_COUNT         = "3"    # ...this many opens inside the window triggers one burst alert
IGNORE_FIRST_SECONDS = "15"  # hits sooner than this are treated as scanner pre-fetch, not a person
NOTIFY_EVERY_OPEN   = "0"    # "1" = email on every single re-open (noisy)
TZ                  = "Asia/Jerusalem"

[triggers]
crons = ["0 * * * *"]   # hourly "not opened" sweep; use "*/15 * * * *" for tighter timing

# Secrets (do NOT put these here) — set them once:
#   wrangler secret put SHARED_SECRET     (any long random string; also goes in the Outlook macro)
#   wrangler secret put RESEND_API_KEY    (from resend.com)
