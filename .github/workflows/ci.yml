name: CI

# Deliberately minimal for this repo's size: no test suite (there's nothing
# meaningful to unit-test - thin glue code), no dependency scanning (one
# dependency), no custom deploy step (Vercel's own Git integration deploys).
#
# This exists to catch two real failure modes we've actually hit:
#  1. A typo/syntax error in one of the serverless functions or the Chrome
#     extension's content script.
#  2. A vercel.json/manifest.json config change that breaks the deploy itself
#     (e.g. the cron-schedule-not-allowed-on-Hobby incident) - caught by
#     `vercel build`, before it ever reaches a real deployment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repo and calls Vercel's own
# API with its own token - it never needs to write to the repo, open PRs, or
# touch any other GitHub API. Explicit, rather than relying on the
# organization/repo default GITHUB_TOKEN permission (which can be broader).
permissions:
  contents: read

jobs:
  syntax-and-json:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a full commit SHA, not a mutable version tag - a
      # tag can be moved (accidentally or via a compromised maintainer
      # account, as happened to tj-actions/changed-files in 2025); a commit
      # SHA can't be silently swapped out from under a workflow.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          set -e
          find . -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 -I{} sh -c 'echo "checking {}"; node --check "{}"'

      - name: Validate JSON config files
        run: |
          set -e
          for f in vercel.json package.json alt/gmail-extension/manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('$f OK')"
          done

  vercel-build-check:
    runs-on: ubuntu-latest
    needs: syntax-and-json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20

      # Job-level `if:` can't reference secrets directly, so gate individual
      # steps on a plain step output instead - skips cleanly (not a failure)
      # until VERCEL_TOKEN is added as a repo secret.
      - name: Check whether Vercel secrets are configured
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN secret not set - skipping the Vercel build dry-run."
          fi

      - name: Install Vercel CLI
        if: steps.check.outputs.available == 'true'
        # Pinned, not @latest - an unpinned CI dependency means every run can
        # silently pull a different (and unreviewed) version of a tool with
        # broad access (VERCEL_TOKEN). Bump deliberately when there's a
        # reason to, not automatically on every run.
        run: npm install --global vercel@59.19.0

      - name: Pull Vercel project settings
        if: steps.check.outputs.available == 'true'
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Vercel build (dry run - catches deploy-breaking config errors)
        if: steps.check.outputs.available == 'true'
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
