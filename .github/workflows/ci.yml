name: CI

# Deliberately minimal for this repo's size: no test suite (there's nothing
# meaningful to unit-test - thin glue code), no dependency scanning (one
# dependency), no custom deploy step (Vercel's own Git integration deploys).
#
# This exists to catch two real failure modes we've actually hit:
#  1. A typo/syntax error in one of the serverless functions or the Chrome
#     extension's content script.
#  2. A vercel.json/manifest.json config change that breaks the deploy itself
#     (e.g. the cron-schedule-not-allowed-on-Hobby incident) - caught by
#     `vercel build`, before it ever reaches a real deployment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          set -e
          find . -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 -I{} sh -c 'echo "checking {}"; node --check "{}"'

      - name: Validate JSON config files
        run: |
          set -e
          for f in vercel.json package.json alt/gmail-extension/manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('$f OK')"
          done

  vercel-build-check:
    runs-on: ubuntu-latest
    needs: syntax-and-json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # Job-level `if:` can't reference secrets directly, so gate individual
      # steps on a plain step output instead - skips cleanly (not a failure)
      # until VERCEL_TOKEN is added as a repo secret.
      - name: Check whether Vercel secrets are configured
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN secret not set - skipping the Vercel build dry-run."
          fi

      - name: Install Vercel CLI
        if: steps.check.outputs.available == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        if: steps.check.outputs.available == 'true'
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Vercel build (dry run - catches deploy-breaking config errors)
        if: steps.check.outputs.available == 'true'
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
